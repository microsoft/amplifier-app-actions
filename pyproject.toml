[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-app-actions"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "amplifier-foundation",
    "amplifier-app-cli",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Required by loop-pipeline's manager handler — declared as a workspace peer
    # in loop-pipeline/pyproject.toml but the workspace path doesn't resolve when
    # loop-pipeline is installed from a git subdirectory URI.
    #
    # Package name is amplifier-unified-llm-client (renamed upstream in
    # amplifier-bundle-attractor #50 to avoid a PyPI name collision; app-actions
    # was pinned to a pre-rename commit, which masked the drift until this
    # module’s source moved to amplifier-bundle-dot-runner and needed re-resolving).
    "amplifier-unified-llm-client",
]

[project.scripts]
amplifier-triage = "amplifier_app_actions.wrapper:cli_main"

[project.entry-points."amplifier.modules"]
tool-github-post-comment  = "amplifier_app_actions.tools.github_post_comment:mount"
tool-github-add-label     = "amplifier_app_actions.tools.github_add_label:mount"
tool-github-checkout-repo = "amplifier_app_actions.tools.github_checkout_repo:mount"

[tool.uv]
package = true

[tool.uv.sources]
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", branch = "main" }
amplifier-app-cli = { git = "https://github.com/microsoft/amplifier-app-cli", branch = "main" }
amplifier-unified-llm-client = { git = "https://github.com/microsoft/amplifier-bundle-dot-runner", subdirectory = "modules/unified-llm-client", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_app_actions"]
include = ["bundles/**"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
