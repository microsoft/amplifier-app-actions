bundle:
  name: app-actions-behavior
  version: 0.1.0
  description: >
    GitHub Actions setup/debugging experts for amplifier-app-actions.
    This is the correct --app install target (replacing the old
    bundles/app-actions.bundle.md fat-bundle-as-behavior mistake).

# Install anchor only — no includes, no session config, no context, no
# providers. Adding this behavior via `amplifier bundle add ... --app` pins
# this repo into the registry; the modes hook then discovers modes/ by
# scanning the repo root (this is structural — any composed piece of a
# bundle's repo makes its modes/ dir discoverable, see amplifier-bundle-modes
# "Composed bundle modes/ dirs (lazy discovery)"). That is enough for
# /github-actions to become available.
#
# The github-actions mode contributes its expert agents via its own
# `contributes.agents` block (github-actions-expert, app-actions-expert,
# dot-setup-expert) — loaded only while the mode is active. Local PR review
# (pr-review-agent) is a separate Agent Skill, not a mode — it is installed
# via `npx skill add` and is not activated through `contributes.agents` or
# any mode shortcut.
# This behavior therefore carries zero always-on tokens and zero forced
# dependencies: no foundation include, no attractor include, no providers
# block pinning a model. Foundation is composed by the root bundle.md for
# users who load this repo as a standalone session bundle; for --app users,
# whatever provider/session/tools their own primary bundle already supplies
# is what these experts inherit when spawned.
#
# Want dot-setup-expert to have full attractor DOT documentation instead of
# a degraded (opportunistically-skipped) @attractor: reference? Add the
# opt-in overlay: behaviors/app-actions-attractor.yaml.
